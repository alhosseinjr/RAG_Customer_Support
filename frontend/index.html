<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEDE6;
    --panel: #F7F5F0;
    --ink: #1C2621;
    --ink-soft: #55625A;
    --forest: #2E5C4C;
    --forest-dark: #1F4235;
    --navy: #35415C;
    --sand: #E7E0CF;
    --amber: #B98A3B;
    --amber-bg: #F4E9D6;
    --line: #D8D2C2;
    --white: #FFFFFF;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "chat   insight"
      "input  insight";
    height: 100vh;
    max-width: 1180px;
    margin: 0 auto;
  }

  @media (max-width: 860px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-areas:
        "header"
        "chat"
        "input";
    }
    .insight { display: none; }
    .insight.open {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 20;
      max-width: none;
    }
  }

  /* ---------- Header ---------- */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px 14px;
  }

  .wordmark {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .wordmark span {
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
  }

  .status-pill {
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--forest);
  }
  .status-dot.off { background: #C0673F; }

  .insight-toggle {
    display: none;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    cursor: pointer;
  }
  @media (max-width: 860px) {
    .insight-toggle { display: inline-flex; }
  }

  /* ---------- Chat column ---------- */
  .chat-col {
    grid-area: chat;
    overflow-y: auto;
    padding: 8px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble-row {
    display: flex;
    animation: rise 220ms ease-out;
  }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .bubble.user {
    background: var(--sand);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: var(--forest);
    color: var(--white);
    border-bottom-left-radius: 4px;
  }
  .bubble.bot.escalated {
    background: var(--forest-dark);
    box-shadow: inset 0 0 0 1px rgba(185, 138, 59, 0.55);
  }
  .bubble.error {
    background: #F4E2DC;
    color: #7A3826;
    border: 1px solid #E3B5A3;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 14px 16px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.7);
    animation: bounce 1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Input ---------- */
  .input-row {
    grid-area: input;
    padding: 14px 28px 24px;
    display: flex;
    gap: 10px;
  }
  .input-row textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    background: var(--white);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
    max-height: 120px;
  }
  .input-row textarea:focus {
    outline: 2px solid var(--forest);
    outline-offset: 1px;
  }
  .input-row button {
    background: var(--forest);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    padding: 0 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .input-row button:hover { background: var(--forest-dark); }
  .input-row button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .input-row button:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Insight panel ---------- */
  .insight {
    grid-area: insight;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 22px 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .insight-close {
    display: none;
    align-self: flex-end;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  @media (max-width: 860px) {
    .insight-close { display: block; }
  }

  .insight h2 {
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  .insight p.lead {
    font-size: 13px;
    color: var(--ink-soft);
    margin: -10px 0 0;
    line-height: 1.5;
  }

  .metric {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    transition: opacity 180ms ease;
  }
  .metric-label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .metric-value {
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .metric-value .confidence {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .escalate-flag {
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 999px;
    width: fit-content;
  }
  .escalate-flag.no {
    background: rgba(46, 92, 76, 0.12);
    color: var(--forest-dark);
  }
  .escalate-flag.yes {
    background: var(--amber-bg);
    color: #7A5A1E;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 7px;
    color: var(--ink-soft);
  }

  .empty-state {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="wordmark">Order Support <span>demo console</span></div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="status-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking backend…</span>
      </div>
      <button class="insight-toggle" id="insightToggle">Pipeline</button>
    </div>
  </header>

  <div class="chat-col" id="chatCol" role="log" aria-live="polite"></div>

  <form class="input-row" id="chatForm">
    <label for="messageInput" class="visually-hidden" style="position:absolute; left:-9999px;">Message</label>
    <textarea id="messageInput" rows="1" placeholder="Ask about an order, refund, or account…" autocomplete="off"></textarea>
    <button type="submit" id="sendBtn">Send</button>
  </form>

  <aside class="insight" id="insightPanel">
    <button class="insight-close" id="insightClose" aria-label="Close pipeline panel">×</button>
    <div>
      <h2>Pipeline insight</h2>
      <p class="lead">What the model decided on the last message, stage by stage.</p>
    </div>
    <div id="insightBody">
      <p class="empty-state">Send a message to see the language, sentiment, and intent classification live.</p>
    </div>
  </aside>
</div>

<script>
  const API_BASE = ""; // same origin -- this page is served by the FastAPI app itself
  const sessionId = crypto.randomUUID();

  const chatCol = document.getElementById("chatCol");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const insightBody = document.getElementById("insightBody");
  const insightPanel = document.getElementById("insightPanel");
  const insightToggle = document.getElementById("insightToggle");
  const insightClose = document.getElementById("insightClose");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  function addBubble(text, who, opts = {}) {
    const row = document.createElement("div");
    row.className = `bubble-row ${who}`;
    const bubble = document.createElement("div");
    bubble.className = `bubble ${who}`;
    if (opts.escalated) bubble.classList.add("escalated");
    if (opts.error) bubble.classList.add("error");
    bubble.textContent = text;
    row.appendChild(bubble);
    chatCol.appendChild(row);
    chatCol.scrollTop = chatCol.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "bubble-row bot";
    row.id = "typingRow";
    row.innerHTML = `<div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatCol.appendChild(row);
    chatCol.scrollTop = chatCol.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typingRow")?.remove();
  }

  function pct(x) {
    return `${Math.round(x * 100)}%`;
  }

  function renderInsight(data) {
    const escalateClass = data.escalate ? "yes" : "no";
    const escalateLabel = data.escalate ? "Needs human review" : "Handled automatically";

    const chips = (data.retrieved_categories || [])
      .filter((c, i, arr) => arr.indexOf(c) === i)
      .map(c => `<span class="chip">${c}</span>`)
      .join("");

    // Mirrors src/config.py's LANG_MIN_CONFIDENCE -- keep these in sync.
    // Below this, the backend already defaulted to English, so showing
    // the raw (low) confidence next to "EN" would misleadingly read as
    // "19% confident it's English" instead of "uncertain, defaulted."
    const langDefaulted = data.language_confidence < 0.5;
    const langDisplay = langDefaulted
      ? `${data.detected_language.toUpperCase()} <span class="confidence">defaulted, low confidence</span>`
      : `${data.detected_language.toUpperCase()} <span class="confidence">${pct(data.language_confidence)}</span>`;

    insightBody.innerHTML = `
      <div class="metric">
        <div class="metric-label">Detected language</div>
        <div class="metric-value">${langDisplay}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Sentiment</div>
        <div class="metric-value">${data.sentiment} <span class="confidence">${pct(data.sentiment_confidence)}</span></div>
      </div>
      <div class="metric">
        <div class="metric-label">Intent</div>
        <div class="metric-value">${data.intent.replaceAll("_", " ")}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Routing</div>
        <div class="escalate-flag ${escalateClass}">${escalateLabel}</div>
      </div>
      ${chips ? `<div class="metric"><div class="metric-label">Retrieved from</div><div class="chips">${chips}</div></div>` : ""}
    `;
  }

  async function sendMessage(text) {
    addBubble(text, "user");
    addTyping();
    sendBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      removeTyping();

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        addBubble(body.detail || "Something went wrong on the backend.", "bot", { error: true });
        return;
      }

      const data = await res.json();
      addBubble(data.response, "bot", { escalated: data.escalate });
      renderInsight(data);
    } catch (err) {
      removeTyping();
      addBubble("Couldn't reach the backend. Is uvicorn still running on port 8000?", "bot", { error: true });
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  insightToggle.addEventListener("click", () => insightPanel.classList.add("open"));
  insightClose.addEventListener("click", () => insightPanel.classList.remove("open"));

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`);
      const data = await res.json();
      if (data.models_loaded) {
        statusDot.classList.remove("off");
        statusText.textContent = "Backend ready";
      } else {
        statusDot.classList.add("off");
        statusText.textContent = "Models not loaded — run the training pipeline";
      }
    } catch {
      statusDot.classList.add("off");
      statusText.textContent = "Backend unreachable";
    }
  }

  checkHealth();
  addBubble(
    "Hi! I'm here to help with orders, billing, refunds, or your account. What can I help you with?",
    "bot"
  );
</script>

</body>
</html>
